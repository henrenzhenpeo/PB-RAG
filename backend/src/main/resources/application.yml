server:
  port: 8088

spring:
  application:
    name: pbrag
  threads:
    virtual:
      enabled: true
  # 不在本机启动容器。本地开发默认通过 SSH 隧道连接远程 PostgreSQL 和 Redis。
  docker:
    compose:
      enabled: false
  datasource:
    url: ${PBRAG_DB_URL:jdbc:postgresql://116.62.53.31:5432/pbrag}
    username: ${PBRAG_DB_USERNAME:pbrag}
    password: ${PBRAG_DB_PASSWORD}
  data:
    redis:
      host: ${PBRAG_REDIS_HOST:116.62.53.31}
      port: ${PBRAG_REDIS_PORT:6379}
      password: ${PBRAG_REDIS_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none

management:
  tracing:
    sampling:
      probability: ${PBRAG_TRACE_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  include-application-name: false
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) %clr(%logger{28}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-} workspaceId=%X{workspaceId:-}] %logger - %msg%n"
  file:
    name: ${PBRAG_LOG_FILE:./logs/pbrag.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

pbrag:
  storage:
    local:
      root: ${PBRAG_STORAGE_ROOT:./data/objects}
  ingestion:
    max-file-size: 5242880

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

---
spring:
  config:
    activate:
      on-profile: local

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    dev.pbrag.identity.mapper: DEBUG
    dev.pbrag.knowledge.mapper: DEBUG
    dev.pbrag.ingestion.mapper: DEBUG
