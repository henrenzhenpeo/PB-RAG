server:
  port: 8080

spring:
  application:
    name: pbrag
  threads:
    virtual:
      enabled: true
  # 不在本机启动容器。PostgreSQL 和 Redis 直接使用下面的地址，稍后改成服务器地址。
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/pbrag
    username: pbrag
    password: pbrag
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
