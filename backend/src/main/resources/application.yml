server:
  port: 8088

spring:
  application:
    name: pbrag
  # 默认启用百炼 OpenAI-compatible 模型配置，使入库 Worker 随应用启动。
  # 本地没有 OPENAI_API_KEY、只需运行非模型功能时，可暂时注释下面两行。
  profiles:
    active: openai
  threads:
    virtual:
      enabled: true
  jackson:
    # API 日期时间统一使用 Asia/Shanghai 时区；Jackson 3 默认输出 ISO 8601 字符串。
    time-zone: Asia/Shanghai
  # 不在本机启动容器。本地开发默认通过 SSH 隧道连接远程 PostgreSQL 和 Redis。
  docker:
    compose:
      enabled: false
  datasource:
    url: ${PBRAG_DB_URL:jdbc:postgresql://116.62.53.31:5432/pbrag}
    username: ${PBRAG_DB_USERNAME:pbrag}
    password: ${PBRAG_DB_PASSWORD}
  data:
    redis:
      host: ${PBRAG_REDIS_HOST:116.62.53.31}
      port: ${PBRAG_REDIS_PORT:6379}
      password: ${PBRAG_REDIS_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none

management:
  tracing:
    sampling:
      probability: ${PBRAG_TRACE_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  include-application-name: false
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) %clr(%logger{28}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-} workspaceId=%X{workspaceId:-}] %logger - %msg%n"
  file:
    name: ${PBRAG_LOG_FILE:./logs/pbrag.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

pbrag:
  storage:
    local:
      root: ${PBRAG_STORAGE_ROOT:./data/objects}
  ingestion:
    max-file-size: 5242880
    chunking:
      target-characters: 1000
      maximum-characters: 1500
    worker:
      poll-delay-ms: 1000
      lease-seconds: 300
      retry-delay-seconds: 30
    embedding:
      # 必须与所选 Embedding 模型输出和 chunks.embedding 列维度一致。
      dimensions: 1024
      # qwen3.7-text-embedding-flash 同步接口单批最多 20 条。
      batch-size: 20
  retrieval:
    embedding-dimensions: 1024
    candidate-top-k: 30
    fusion-top-k: 30
    rerank-top-k: 10
    top-k: 6
    rrf-constant: 60
    minimum-similarity: 0.2
    rerank:
      enabled: ${PBRAG_RERANK_ENABLED:false}
      # 百炼业务空间专属地址，例如 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
      url: ${PBRAG_RERANK_URL:}
      api-key: ${PBRAG_RERANK_API_KEY:${OPENAI_API_KEY:}}
      model: ${PBRAG_RERANK_MODEL:qwen3.7-text-rerank}
  rag:
    maximum-context-characters: 12000

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      # Spring AI 2 使用 OpenAI Java Client，客户端在该地址后追加 /embeddings，因此必须保留 /v1。
      base-url: ${PBRAG_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${PBRAG_CHAT_MODEL:qwen3.7-flash}
      embedding:
        model: ${PBRAG_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
        dimensions: 1024
    # PB-RAG 自己维护 chunks、向量写入和检索，不能启用 Spring AI 默认 vector_store 表。
    vectorstore:
      type: none

---
spring:
  config:
    activate:
      on-profile: local

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    dev.pbrag.identity.mapper: DEBUG
    dev.pbrag.knowledge.mapper: DEBUG
    dev.pbrag.ingestion.mapper: DEBUG
