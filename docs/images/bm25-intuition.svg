<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="t d">
<title id="t">BM25 的三个直觉</title><desc id="d">稀有词更重要，词频增加的收益递减，长文档获得长度校正。</desc>
<rect width="1080" height="500" rx="24" fill="#f8fafc"/><text x="42" y="62" font-family="Arial,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#17233d">BM25 为什么能找到精确技术词？</text><text x="42" y="94" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#53647e">它根据词项在语料中的区分力、出现次数和文档长度排序</text>
<g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="42" y="132" width="312" height="270" rx="18" fill="#edf0ff" stroke="#5964c8" stroke-width="2"/><text x="62" y="172" font-size="22" font-weight="700" fill="#293a9b">① 稀有词更有区分力</text><text x="62" y="213" font-size="17" fill="#27364d">“的”几乎每篇都有</text><text x="62" y="247" font-size="17" fill="#27364d">“WORKER_LEASE_EXPIRED”很少见</text><rect x="62" y="279" width="80" height="13" rx="6" fill="#bdc6df"/><rect x="62" y="315" width="244" height="13" rx="6" fill="#5964c8"/><text x="62" y="372" font-size="15" fill="#53647e">IDF：罕见词命中更有价值</text>
<rect x="384" y="132" width="312" height="270" rx="18" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="404" y="172" font-size="22" font-weight="700" fill="#087557">② 词频收益会变慢</text><text x="404" y="213" font-size="17" fill="#27364d">出现 1 → 2 次，信息增加明显</text><text x="404" y="247" font-size="17" fill="#27364d">出现 20 → 21 次，增益很小</text><path d="M405 336 C450 285 492 278 537 274 S630 270 672 270" fill="none" stroke="#19986e" stroke-width="4"/><path d="M405 342H672" stroke="#a8d9c6" stroke-width="2"/><text x="404" y="372" font-size="15" fill="#53647e">词频饱和：避免重复堆词刷分</text>
<rect x="726" y="132" width="312" height="270" rx="18" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="746" y="172" font-size="22" font-weight="700" fill="#9d620c">③ 文档长度要校正</text><text x="746" y="213" font-size="17" fill="#27364d">长 Chunk 天然包含更多词</text><text x="746" y="247" font-size="17" fill="#27364d">命中不一定更聚焦</text><rect x="746" y="280" width="242" height="18" rx="6" fill="#efd9a5"/><rect x="746" y="316" width="112" height="18" rx="6" fill="#d59620"/><text x="746" y="372" font-size="15" fill="#53647e">长度校正：让长短片段可比较</text></g>
<rect x="42" y="427" width="996" height="49" rx="12" fill="#eaf0fa"/><text x="60" y="457" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#233a69">PB-RAG：ParadeDB 的 chinese_lindera 分词 + BM25 索引建在 chunks.content 上，取 KEYWORD Top 30。</text></svg>
