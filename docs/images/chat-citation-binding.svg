<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="t d"><title id="t">问答消息与版本化引用的关系</title><desc id="d">一轮问答共享 turn_id，USER 消息已完成，ASSISTANT 消息流式生成；引用记录绑定助手消息、Chunk 和文档版本，并保存来源位置快照。</desc><rect width="1120" height="490" rx="24" fill="#f8fafc"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="58" font-size="30" font-weight="700" fill="#17233d">回答里的 [1]，究竟指向什么？</text><text x="42" y="91" font-size="17" fill="#53647e">编号来自真实 CONTEXT 证据，引用元数据在模型回答前写入数据库</text><rect x="42" y="143" width="297" height="235" rx="17" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="63" y="183" font-size="21" font-weight="700" fill="#253d91">chat_messages</text><text x="63" y="225" font-size="17" fill="#27364d">USER：COMPLETED</text><text x="63" y="261" font-size="17" fill="#27364d">ASSISTANT：STREAMING</text><text x="63" y="297" font-size="17" fill="#27364d">两条消息共享 turn_id</text><text x="63" y="343" font-size="15" fill="#53647e">完成 / 停止后更新助手终态</text><path d="M340 260h52" stroke="#66758d" stroke-width="3"/><path d="m383 251 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="397" y="143" width="354" height="235" rx="17" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="418" y="183" font-size="21" font-weight="700" fill="#087557">message_citations</text><text x="418" y="225" font-size="17" fill="#27364d">ordinal = 1，即正文 [1]</text><text x="418" y="261" font-size="17" fill="#27364d">chunk_id + document_version_id</text><text x="418" y="297" font-size="17" fill="#27364d">source_position + excerpt 快照</text><text x="418" y="343" font-size="15" fill="#53647e">历史回答保留当时的版本来源</text><path d="M752 260h52" stroke="#66758d" stroke-width="3"/><path d="m795 251 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="809" y="143" width="269" height="235" rx="17" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="830" y="183" font-size="21" font-weight="700" fill="#98610f">SSE 前端事件</text><text x="830" y="225" font-size="17" fill="#27364d">citations → delta</text><text x="830" y="261" font-size="17" fill="#27364d">→ completed / error</text><text x="830" y="309" font-size="16" fill="#53647e">前端不从自然语言里</text><text x="830" y="337" font-size="16" fill="#53647e">猜测引用来源</text><rect x="42" y="410" width="1036" height="52" rx="12" fill="#eaf0fa"/><text x="63" y="443" font-size="17" fill="#253d91">文档切到 v2 后，旧回答的引用仍保存当时的 document_version_id 和来源位置。</text></g></svg>
