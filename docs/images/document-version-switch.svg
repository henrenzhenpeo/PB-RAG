<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="t d"><title id="t">文档新版本完成后才切换当前版本</title><desc id="d">已有文档的 v1 仍作为当前版本参与检索，v2 入库期间不参与；v2 成功完成后与 Job 完成状态在同一事务切换为当前版本。</desc><rect width="1120" height="450" rx="24" fill="#f8fafc"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="58" font-size="30" font-weight="700" fill="#17233d">上传 v2 时，检索会不会读到半成品？</text><text x="42" y="91" font-size="17" fill="#53647e">documents.current_version_id 控制生产检索可见的版本</text><rect x="42" y="145" width="485" height="230" rx="18" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="64" y="187" font-size="21" font-weight="700" fill="#253d91">v2 入库中</text><text x="64" y="226" font-size="17" fill="#27364d">document_versions：v1 + v2</text><text x="64" y="263" font-size="17" fill="#27364d">ingestion_jobs(v2)：RUNNING</text><text x="64" y="300" font-size="17" fill="#27364d">documents.current_version_id → v1</text><text x="64" y="339" font-size="16" fill="#53647e">查询仍只读 v1；v2 失败或取消也不切换</text><path d="M528 258h62" stroke="#66758d" stroke-width="3"/><path d="m581 249 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><text x="559" y="234" text-anchor="middle" font-size="16" fill="#53647e">成功提交</text><rect x="595" y="145" width="483" height="230" rx="18" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="617" y="187" font-size="21" font-weight="700" fill="#087557">v2 入库成功</text><text x="617" y="226" font-size="17" fill="#27364d">ingestion_jobs(v2)：COMPLETED</text><text x="617" y="263" font-size="17" fill="#27364d">documents.current_version_id → v2</text><text x="617" y="300" font-size="17" fill="#27364d">新查询读 v2；历史引用保留 v1</text><text x="617" y="339" font-size="16" fill="#53647e">Job 完成与当前版本切换同一数据库事务</text></g></svg>
