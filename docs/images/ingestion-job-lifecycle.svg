<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="t d"><title id="t">入库任务状态、阶段与租约</title><desc id="d">任务从 PENDING 经解析、分片、向量化、索引到完成。临时故障等待重试，永久故障失败，用户可取消。租约决定哪个 Worker 可以推进。</desc><rect width="1120" height="550" rx="24" fill="#f8fafc"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="58" font-size="30" font-weight="700" fill="#17233d">同一条 ingestion_jobs 怎样变化？</text><text x="42" y="91" font-size="17" fill="#53647e">status 表示任务生命周期；stage 表示流水线位置</text><g font-size="18" font-weight="700" text-anchor="middle"><rect x="42" y="150" width="145" height="84" rx="14" fill="#eaf0ff" stroke="#5869c2" stroke-width="2"/><text x="114" y="185" fill="#253d91">PENDING</text><text x="114" y="211" fill="#53647e" font-size="14">等待领取</text><rect x="224" y="150" width="145" height="84" rx="14" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="296" y="185" fill="#253d91">PARSING</text><text x="296" y="211" fill="#53647e" font-size="14">读取原文件</text><rect x="406" y="150" width="145" height="84" rx="14" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="478" y="185" fill="#253d91">CHUNKING</text><text x="478" y="211" fill="#53647e" font-size="14">写入 chunks</text><rect x="588" y="150" width="145" height="84" rx="14" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="660" y="185" fill="#253d91">EMBEDDING</text><text x="660" y="211" fill="#53647e" font-size="14">写入向量</text><rect x="770" y="150" width="145" height="84" rx="14" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="842" y="185" fill="#253d91">INDEXING</text><text x="842" y="211" fill="#53647e" font-size="14">准备完成</text><rect x="952" y="150" width="126" height="84" rx="14" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="1015" y="185" fill="#087557">COMPLETED</text><text x="1015" y="211" fill="#53647e" font-size="14">切换当前版本</text></g><g fill="none" stroke="#66758d" stroke-width="2"><path d="M188 192h35m147 0h35m147 0h35m147 0h35m147 0h35"/></g><g fill="#66758d"><path d="m216 184 10 8-10 8m172-16 10 8-10 8m172-16 10 8-10 8m172-16 10 8-10 8m172-16 10 8-10 8"/></g><rect x="42" y="278" width="306" height="158" rx="16" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="62" y="315" font-size="21" font-weight="700" fill="#98610f">临时故障 → RETRY_WAIT</text><text x="62" y="350" font-size="16" fill="#27364d">available_at 到期后重新 PENDING</text><text x="62" y="384" font-size="16" fill="#27364d">attempt_count 记录领取次数</text><rect x="407" y="278" width="306" height="158" rx="16" fill="#fceeea" stroke="#c36950" stroke-width="2"/><text x="427" y="315" font-size="21" font-weight="700" fill="#a34d36">永久故障 → FAILED</text><text x="427" y="350" font-size="16" fill="#27364d">解析无文本、维度错误等</text><text x="427" y="384" font-size="16" fill="#27364d">error_code 保留原因</text><rect x="772" y="278" width="306" height="158" rx="16" fill="#eaf0ff" stroke="#5869c2" stroke-width="2"/><text x="792" y="315" font-size="21" font-weight="700" fill="#253d91">用户取消 → CANCELLED</text><text x="792" y="350" font-size="16" fill="#27364d">先持久化 PostgreSQL 终态</text><text x="792" y="384" font-size="16" fill="#27364d">Redis 标记加快 Worker 停止</text><rect x="42" y="465" width="1036" height="56" rx="12" fill="#eaf0fa"/><text x="62" y="500" font-size="17" fill="#253d91">领取：FOR UPDATE SKIP LOCKED　｜　推进：预期阶段 + lease_owner 条件更新　｜　过期：可恢复</text></g></svg>
