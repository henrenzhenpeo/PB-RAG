<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="t d"><title id="t">原文解析、分片和向量化</title><desc id="d">Markdown 或文本 PDF 被解析成带行号页码的块，再按标题和长度分片；chunks 先保存正文和来源位置，之后写入 1024 维向量。</desc><rect width="1120" height="530" rx="24" fill="#f8fafc"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="58" font-size="30" font-weight="700" fill="#17233d">原文如何变成可检索的 Chunk？</text><text x="42" y="91" font-size="17" fill="#53647e">每一步都保留“来自哪里”，以便回答时回指原文</text><rect x="42" y="146" width="230" height="260" rx="17" fill="#fff" stroke="#9aadc8" stroke-width="2"/><text x="62" y="185" font-size="21" font-weight="700" fill="#253d91">原始文档</text><text x="62" y="224" font-size="18" fill="#27364d"># 任务恢复</text><path d="M62 247h186M62 275h174M62 303h180M62 331h135" stroke="#bdc9d8" stroke-width="9" stroke-linecap="round"/><text x="62" y="376" font-size="15" fill="#53647e">.md / 文本 .pdf</text><path d="M273 275h48" stroke="#66758d" stroke-width="3"/><path d="m312 266 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="326" y="146" width="230" height="260" rx="17" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="346" y="185" font-size="21" font-weight="700" fill="#253d91">解析块</text><text x="346" y="224" font-size="17" fill="#27364d">headingPath：任务恢复</text><text x="346" y="260" font-size="17" fill="#27364d">startLine：1</text><text x="346" y="296" font-size="17" fill="#27364d">endLine：4</text><text x="346" y="332" font-size="17" fill="#27364d">PDF 则记录页码</text><path d="M557 275h48" stroke="#66758d" stroke-width="3"/><path d="m596 266 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="610" y="146" width="230" height="260" rx="17" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="630" y="185" font-size="21" font-weight="700" fill="#98610f">chunks 表</text><text x="630" y="224" font-size="17" fill="#27364d">sequence_number：0</text><text x="630" y="260" font-size="17" fill="#27364d">content：片段正文</text><text x="630" y="296" font-size="17" fill="#27364d">source_position：位置</text><text x="630" y="332" font-size="17" fill="#27364d">embedding：NULL</text><path d="M841 275h48" stroke="#66758d" stroke-width="3"/><path d="m880 266 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="894" y="146" width="184" height="260" rx="17" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="914" y="185" font-size="21" font-weight="700" fill="#087557">向量化</text><text x="914" y="224" font-size="17" fill="#27364d">分批调用模型</text><text x="914" y="260" font-size="17" fill="#27364d">校验 1024 维</text><text x="914" y="296" font-size="17" fill="#27364d">UPDATE</text><text x="914" y="332" font-size="17" fill="#27364d">chunks.embedding</text><rect x="42" y="437" width="1036" height="58" rx="12" fill="#eaf0fa"/><text x="62" y="473" font-size="17" fill="#253d91">重试时按版本事务替换旧 Chunk；顺序和来源位置可复现，Chunk UUID 不保证跨重建不变。</text></g></svg>
