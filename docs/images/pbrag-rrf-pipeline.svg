<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="t d"><title id="t">PB-RAG 双路召回与 RRF 排名融合</title><desc id="d">用户问题分别走向量和 BM25 两条检索路径，各取前 30；按 Chunk ID 去重后使用 RRF 排名融合，可选 Rerank，再裁剪最终上下文。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#66758d" stroke-width="1.6"/></marker></defs><rect width="1200" height="530" rx="24" fill="#f8fafc"/><text x="44" y="62" font-family="Arial,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#17233d">PB-RAG 实际采用：双路召回 → RRF → 可选重排 → Context</text><g font-family="Arial,Microsoft YaHei,sans-serif" text-anchor="middle"><rect x="36" y="218" width="155" height="90" rx="14" fill="#eaf0ff" stroke="#5368bd" stroke-width="2"/><text x="113" y="254" font-size="20" font-weight="700" fill="#243c8c">用户问题</text><text x="113" y="281" font-size="15" fill="#53647e">限定 Workspace / KB</text><rect x="288" y="112" width="202" height="100" rx="14" fill="#edf0ff" stroke="#5964c8" stroke-width="2"/><text x="389" y="151" font-size="20" font-weight="700" fill="#293a9b">向量召回</text><text x="389" y="179" font-size="16" fill="#53647e">相似度 Top 30</text><rect x="288" y="323" width="202" height="100" rx="14" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="389" y="362" font-size="20" font-weight="700" fill="#9d620c">BM25 召回</text><text x="389" y="390" font-size="16" fill="#53647e">词项分数 Top 30</text><rect x="573" y="218" width="196" height="90" rx="14" fill="#eaf0ff" stroke="#5368bd" stroke-width="2"/><text x="671" y="253" font-size="20" font-weight="700" fill="#243c8c">RRF 排名融合</text><text x="671" y="280" font-size="16" fill="#53647e">按 chunk_id 去重</text><rect x="837" y="218" width="148" height="90" rx="14" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="911" y="253" font-size="19" font-weight="700" fill="#087557">可选 Rerank</text><text x="911" y="280" font-size="15" fill="#53647e">默认关闭</text><rect x="1036" y="218" width="140" height="90" rx="14" fill="#19986e"/><text x="1106" y="252" font-size="20" font-weight="700" fill="white">CONTEXT</text><text x="1106" y="280" font-size="15" fill="white">Top 6 + 字符预算</text></g><g stroke="#66758d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M191 250L280 175"/><path d="M191 276L280 360"/><path d="M490 162L565 240"/><path d="M490 372L565 286"/><path d="M769 263H829"/><path d="M985 263H1028"/></g><rect x="250" y="459" width="700" height="48" rx="11" fill="#edf2fb"/><text x="600" y="489" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#243c8c">RRF(chunk) = Σ 1 / (60 + 路内排名)　｜　只融合排名，不直接加原始分数</text></svg>
