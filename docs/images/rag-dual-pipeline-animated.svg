<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">PB-RAG 文档入库与 Production RAG 双链路动态总览</title>
  <desc id="desc">上半部分展示文件从上传、对象存储、资源创建、任务领取、解析、分块、向量化到事务完成的入库链路；下半部分展示问题从 Query Embedding、Vector 与 BM25 双路召回、RRF、Rerank、Context 到回答和引用的检索链路。流动圆点表示数据向前传递，虚线表示失败重试或降级。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#243c6a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5 1 9" fill="none" stroke="#78879e" stroke-width="1.7"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5 1 9" fill="none" stroke="#c56358" stroke-width="1.7"/>
    </marker>
    <style>
      .title{font:700 31px Arial,"Microsoft YaHei",sans-serif;fill:#17233d}.subtitle{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#66758d}.lane{font:700 22px Arial,"Microsoft YaHei",sans-serif;fill:#263a62}.node-title{font:700 16px Arial,"Microsoft YaHei",sans-serif;fill:#1e2d49}.node-sub{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#65748d}.code{font:12px "SFMono-Regular",Consolas,monospace;fill:#3159bd}.badge{font:700 12px Arial,"Microsoft YaHei",sans-serif}.edge{fill:none;stroke:#78879e;stroke-width:2.2;marker-end:url(#arrow)}.edge-dashed{fill:none;stroke:#c56358;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow-red)}.node{filter:url(#shadow)}
      .flow-dot{filter:url(#shadow)}
      @media (prefers-reduced-motion: reduce){.flow-dot{display:none}}
    </style>
  </defs>

  <rect width="1500" height="790" rx="26" fill="#f8fafc"/>
  <text x="42" y="52" class="title">PB-RAG：两条链路，一份可追溯证据</text>
  <text x="42" y="82" class="subtitle">上：原文件如何成为可检索 Chunk　｜　下：问题如何成为最终 Context、回答与版本化引用</text>

  <rect x="38" y="108" width="1424" height="288" rx="20" fill="#ffffff" stroke="#dce3ee"/>
  <text x="62" y="143" class="lane">① 文档入库链路</text>
  <text x="1290" y="143" class="subtitle">PostgreSQL Job 是事实来源</text>

  <g class="node">
    <rect x="60" y="176" width="146" height="126" rx="14" fill="#eef3ff" stroke="#4e6de5" stroke-width="2"/>
    <text x="77" y="205" class="node-title">上传校验</text><text x="77" y="232" class="node-sub">Markdown / PDF</text><text x="77" y="253" class="node-sub">大小、类型、文件名</text><text x="77" y="281" class="code">upload()</text>
    <rect x="238" y="176" width="146" height="126" rx="14" fill="#eaf8f2" stroke="#1c9b70" stroke-width="2"/>
    <text x="255" y="205" class="node-title">对象存储</text><text x="255" y="232" class="node-sub">流式写盘</text><text x="255" y="253" class="node-sub">storageKey + SHA-256</text><text x="255" y="281" class="code">storage.store()</text>
    <rect x="416" y="176" width="156" height="126" rx="14" fill="#f1edff" stroke="#7d61d1" stroke-width="2"/>
    <text x="433" y="205" class="node-title">资源与 Job</text><text x="433" y="232" class="node-sub">Document / Version</text><text x="433" y="253" class="node-sub">Job = PENDING</text><text x="433" y="281" class="code">createVersion()</text>
    <rect x="604" y="176" width="148" height="126" rx="14" fill="#f1edff" stroke="#7d61d1" stroke-width="2"/>
    <text x="621" y="205" class="node-title">领取任务</text><text x="621" y="232" class="node-sub">SKIP LOCKED</text><text x="621" y="253" class="node-sub">lease_owner</text><text x="621" y="281" class="code">recoverAndClaim()</text>
    <rect x="784" y="176" width="138" height="126" rx="14" fill="#eef3ff" stroke="#4e6de5" stroke-width="2"/>
    <text x="801" y="205" class="node-title">解析</text><text x="801" y="232" class="node-sub">Markdown AST</text><text x="801" y="253" class="node-sub">PDF pages</text><text x="801" y="281" class="code">parser.parse()</text>
    <rect x="954" y="176" width="138" height="126" rx="14" fill="#eef3ff" stroke="#4e6de5" stroke-width="2"/>
    <text x="971" y="205" class="node-title">分块</text><text x="971" y="232" class="node-sub">标题 + 字符预算</text><text x="971" y="253" class="node-sub">稳定来源位置</text><text x="971" y="281" class="code">split()</text>
    <rect x="1124" y="176" width="148" height="126" rx="14" fill="#fff4e4" stroke="#d67b16" stroke-width="2"/>
    <text x="1141" y="205" class="node-title">Embedding</text><text x="1141" y="232" class="node-sub">20 条 / 批</text><text x="1141" y="253" class="node-sub">vector(1024)</text><text x="1141" y="281" class="code">embedInBatches()</text>
    <rect x="1304" y="176" width="134" height="126" rx="14" fill="#e8f7f1" stroke="#14966a" stroke-width="2"/>
    <text x="1321" y="205" class="node-title">完成发布</text><text x="1321" y="232" class="node-sub">Job COMPLETED</text><text x="1321" y="253" class="node-sub">切换当前版本</text><text x="1321" y="281" class="code">complete()</text>
  </g>

  <g class="edge">
    <path id="i1" d="M206 239H230"/><path id="i2" d="M384 239H408"/><path id="i3" d="M572 239H596"/><path id="i4" d="M752 239H776"/><path id="i5" d="M922 239H946"/><path id="i6" d="M1092 239H1116"/><path id="i7" d="M1272 239H1296"/>
  </g>
  <path id="retry" d="M1198 310 C1198 370 678 375 678 310" class="edge-dashed"/>
  <text x="880" y="365" class="node-sub" fill="#a94f45">瞬时错误 → RETRY_WAIT → 重新领取；永久错误 → FAILED</text>
  <rect x="1240" y="119" width="198" height="30" rx="9" fill="#e8f7f1"/><text x="1339" y="139" text-anchor="middle" class="badge" fill="#087557">版本切换与完成同一事务</text>

  <g fill="#3159db" class="flow-dot"><circle r="5"><animateMotion dur="1.1s" repeatCount="indefinite" path="M206 239H230"/></circle><circle r="5"><animateMotion begin=".15s" dur="1.1s" repeatCount="indefinite" path="M384 239H408"/></circle><circle r="5"><animateMotion begin=".3s" dur="1.1s" repeatCount="indefinite" path="M572 239H596"/></circle><circle r="5"><animateMotion begin=".45s" dur="1.1s" repeatCount="indefinite" path="M752 239H776"/></circle><circle r="5"><animateMotion begin=".6s" dur="1.1s" repeatCount="indefinite" path="M922 239H946"/></circle><circle r="5"><animateMotion begin=".75s" dur="1.1s" repeatCount="indefinite" path="M1092 239H1116"/></circle><circle r="5"><animateMotion begin=".9s" dur="1.1s" repeatCount="indefinite" path="M1272 239H1296"/></circle></g>

  <rect x="38" y="418" width="1424" height="330" rx="20" fill="#ffffff" stroke="#dce3ee"/>
  <text x="62" y="453" class="lane">② Production RAG 检索链路</text>
  <text x="1248" y="453" class="subtitle">每阶段候选与摘要均留痕</text>

  <g class="node">
    <rect x="60" y="526" width="136" height="116" rx="14" fill="#eef3ff" stroke="#4e6de5" stroke-width="2"/><text x="77" y="555" class="node-title">用户问题</text><text x="77" y="581" class="node-sub">规范化 + 作用域</text><text x="77" y="620" class="code">searchDetailed()</text>
    <rect x="228" y="526" width="150" height="116" rx="14" fill="#fff4e4" stroke="#d67b16" stroke-width="2"/><text x="245" y="555" class="node-title">Query Embedding</text><text x="245" y="581" class="node-sub">float[1024]</text><text x="245" y="620" class="code">embeddingModel</text>
    <rect x="428" y="478" width="158" height="104" rx="14" fill="#eaf8f2" stroke="#1c9b70" stroke-width="2"/><text x="445" y="507" class="node-title">Vector Top 30</text><text x="445" y="533" class="node-sub">cosine similarity</text><text x="445" y="558" class="code">pgvector HNSW</text>
    <rect x="428" y="614" width="158" height="104" rx="14" fill="#eaf8f2" stroke="#1c9b70" stroke-width="2"/><text x="445" y="643" class="node-title">BM25 Top 30</text><text x="445" y="669" class="node-sub">chinese_lindera</text><text x="445" y="694" class="code">ParadeDB</text>
    <rect x="650" y="526" width="152" height="116" rx="14" fill="#eef3ff" stroke="#4e6de5" stroke-width="2"/><text x="667" y="555" class="node-title">RRF 融合</text><text x="667" y="581" class="node-sub">按 chunk_id 去重</text><text x="667" y="620" class="code">Σ 1/(60+rank)</text>
    <rect x="850" y="526" width="154" height="116" rx="14" fill="#fff4e4" stroke="#d67b16" stroke-width="2"/><text x="867" y="555" class="node-title">可选 Rerank</text><text x="867" y="581" class="node-sub">Top 10</text><text x="867" y="620" class="code">RerankClient</text>
    <rect x="1052" y="526" width="154" height="116" rx="14" fill="#f1edff" stroke="#7d61d1" stroke-width="2"/><text x="1069" y="555" class="node-title">CONTEXT</text><text x="1069" y="581" class="node-sub">Top 6 + 字符预算</text><text x="1069" y="620" class="code">context()</text>
    <rect x="1254" y="526" width="184" height="116" rx="14" fill="#e8f7f1" stroke="#14966a" stroke-width="2"/><text x="1271" y="555" class="node-title">回答 + 引用</text><text x="1271" y="581" class="node-sub">SSE delta / citations</text><text x="1271" y="620" class="code">RagChatService</text>
  </g>

  <g class="edge">
    <path d="M196 584H220"/><path d="M378 572L420 536"/><path d="M196 597 C280 690 338 688 420 668"/><path d="M586 530 C620 530 620 560 642 570"/><path d="M586 666 C620 666 620 610 642 598"/><path d="M802 584H842"/><path d="M1004 584H1044"/><path d="M1206 584H1246"/>
  </g>
  <path d="M928 650 C928 710 726 710 726 650" class="edge-dashed"/>
  <text x="777" y="720" class="node-sub" fill="#a94f45">超时 / 429 / 5xx → 记录 DEGRADED，沿用 FUSION 顺序</text>
  <rect x="1048" y="434" width="390" height="30" rx="9" fill="#f1edff"/><text x="1243" y="454" text-anchor="middle" class="badge" fill="#6948bd">Workspace + Knowledge Base + currentVersion 在 SQL 内过滤</text>

  <g fill="#d67b16" class="flow-dot"><circle r="5"><animateMotion dur="1.35s" repeatCount="indefinite" path="M196 584H220"/></circle><circle r="5"><animateMotion begin=".2s" dur="1.35s" repeatCount="indefinite" path="M378 572L420 536"/></circle><circle r="5"><animateMotion begin=".2s" dur="1.35s" repeatCount="indefinite" path="M196 597 C280 690 338 688 420 668"/></circle><circle r="5"><animateMotion begin=".4s" dur="1.35s" repeatCount="indefinite" path="M586 530 C620 530 620 560 642 570"/></circle><circle r="5"><animateMotion begin=".4s" dur="1.35s" repeatCount="indefinite" path="M586 666 C620 666 620 610 642 598"/></circle><circle r="5"><animateMotion begin=".65s" dur="1.35s" repeatCount="indefinite" path="M802 584H842"/></circle><circle r="5"><animateMotion begin=".9s" dur="1.35s" repeatCount="indefinite" path="M1004 584H1044"/></circle><circle r="5"><animateMotion begin="1.1s" dur="1.35s" repeatCount="indefinite" path="M1206 584H1246"/></circle></g>

  <g transform="translate(62 765)"><circle cx="0" cy="0" r="6" fill="#3159db"/><text x="14" y="5" class="node-sub">项目内确定性逻辑</text><circle cx="172" cy="0" r="6" fill="#1c9b70"/><text x="186" y="5" class="node-sub">PostgreSQL / 索引</text><circle cx="330" cy="0" r="6" fill="#d67b16"/><text x="344" y="5" class="node-sub">外部模型调用</text><circle cx="472" cy="0" r="6" fill="#7d61d1"/><text x="486" y="5" class="node-sub">作用域 / 事务约束</text></g>
</svg>
