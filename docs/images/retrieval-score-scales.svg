<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="t d"><title id="t">向量与 BM25 分数的量纲不同</title><desc id="d">示意向量相似度 0.82 位于有限的相似度轴，BM25 示例分数 4.51 位于不同的开放尺度，因此 PB-RAG 使用排名融合。</desc><rect width="1080" height="460" rx="24" fill="#f8fafc"/><text x="45" y="65" font-family="Arial,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#17233d">两路分数不在同一把尺子上</text><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="70" y="145" font-size="22" font-weight="700" fill="#087557">向量相似度</text><text x="70" y="176" font-size="16" fill="#53647e">示例：0.82</text><line x1="70" y1="220" x2="766" y2="220" stroke="#19986e" stroke-width="5"/><circle cx="640" cy="220" r="12" fill="#19986e"/><text x="70" y="251" font-size="16" fill="#53647e">较低</text><text x="746" y="251" font-size="16" fill="#53647e">较高</text><text x="70" y="315" font-size="22" font-weight="700" fill="#bd5b37">BM25 词项分数</text><text x="70" y="346" font-size="16" fill="#53647e">示例：4.51</text><line x1="70" y1="390" x2="766" y2="390" stroke="#d86b47" stroke-width="5"/><circle cx="480" cy="390" r="12" fill="#d86b47"/><text x="70" y="421" font-size="16" fill="#53647e">0</text><text x="710" y="421" font-size="16" fill="#53647e">无统一固定上限</text><text x="830" y="266" font-size="80" font-weight="700" fill="#545dc5">≠</text><text x="815" y="327" font-size="20" font-weight="700" fill="#293a9b">不能直接相加</text></g></svg>
