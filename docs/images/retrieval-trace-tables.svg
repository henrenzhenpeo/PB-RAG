<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="t d"><title id="t">检索运行的三张追踪表</title><desc id="d">retrieval_runs 记录一次检索，retrieval_candidates 记录各阶段每个候选，retrieval_stage_summaries 记录每阶段包括零候选和降级的结果。</desc><rect width="1120" height="500" rx="24" fill="#f8fafc"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="58" font-size="30" font-weight="700" fill="#17233d">为什么一次检索要写三张表？</text><text x="42" y="91" font-size="17" fill="#53647e">回答不准确时，能定位候选在哪一阶段进入、退出或降级</text><rect x="42" y="141" width="314" height="285" rx="17" fill="#edf0ff" stroke="#5869c2" stroke-width="2"/><text x="62" y="181" font-size="21" font-weight="700" fill="#253d91">retrieval_runs</text><text x="62" y="218" font-size="17" fill="#27364d">一行 = 一次问题检索</text><text x="62" y="255" font-size="16" fill="#27364d">question / configuration</text><text x="62" y="292" font-size="16" fill="#27364d">status / latency_ms</text><text x="62" y="329" font-size="16" fill="#27364d">final_stage / degradation_code</text><text x="62" y="389" font-size="15" fill="#53647e">回答：整次运行怎么样？</text><rect x="403" y="141" width="314" height="285" rx="17" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="423" y="181" font-size="21" font-weight="700" fill="#98610f">retrieval_candidates</text><text x="423" y="218" font-size="17" fill="#27364d">一行 = 一个阶段的一个 Chunk</text><text x="423" y="255" font-size="16" fill="#27364d">VECTOR / KEYWORD</text><text x="423" y="292" font-size="16" fill="#27364d">FUSION / RERANK / CONTEXT</text><text x="423" y="329" font-size="16" fill="#27364d">rank / score / chunk_id</text><text x="423" y="389" font-size="15" fill="#53647e">回答：哪条证据排第几？</text><rect x="764" y="141" width="314" height="285" rx="17" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="784" y="181" font-size="19" font-weight="700" fill="#087557">retrieval_stage_summaries</text><text x="784" y="218" font-size="17" fill="#27364d">一行 = 一个阶段的执行结果</text><text x="784" y="255" font-size="16" fill="#27364d">COMPLETED / SKIPPED</text><text x="784" y="292" font-size="16" fill="#27364d">DEGRADED / candidate_count</text><text x="784" y="329" font-size="16" fill="#27364d">latency_ms / error_code</text><text x="784" y="389" font-size="15" fill="#53647e">回答：零结果或降级为何发生？</text></g></svg>
