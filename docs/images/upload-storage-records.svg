<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="t d"><title id="t">上传文件时磁盘和数据库分别保存什么</title><desc id="d">原始文件保存在后端本地磁盘，document_versions 只保存 storage_key 与 SHA-256；documents 是逻辑身份，ingestion_jobs 是异步任务。</desc><rect width="1120" height="520" rx="24" fill="#f8fafc"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="58" font-size="30" font-weight="700" fill="#17233d">上传一份 worker.md，数据去了哪里？</text><text x="42" y="90" font-size="17" fill="#53647e">原文件字节与业务元数据分开保存；上传接口很快返回 Job ID</text><rect x="42" y="145" width="200" height="240" rx="18" fill="#eaf0ff" stroke="#5869c2" stroke-width="2"/><text x="66" y="194" font-size="22" font-weight="700" fill="#253d91">用户上传</text><text x="66" y="233" font-size="18" fill="#27364d">worker.md</text><text x="66" y="270" font-size="16" fill="#53647e">校验格式与大小</text><text x="66" y="301" font-size="16" fill="#53647e">流式计算 SHA-256</text><path d="M242 260H286" stroke="#66758d" stroke-width="3"/><path d="m277 251 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="290" y="145" width="342" height="240" rx="18" fill="#fff6e4" stroke="#d59620" stroke-width="2"/><text x="314" y="194" font-size="22" font-weight="700" fill="#98610f">本地对象存储 · 不是表</text><text x="314" y="237" font-size="18" fill="#27364d">./data/objects/</text><text x="314" y="269" font-size="18" fill="#27364d">日期/UUID.md</text><text x="314" y="312" font-size="16" fill="#53647e">保存完整原文件字节</text><text x="314" y="344" font-size="16" fill="#53647e">storage_key 是相对定位键</text><path d="M632 260H676" stroke="#66758d" stroke-width="3"/><path d="m667 251 10 9-10 9" fill="none" stroke="#66758d" stroke-width="3"/><rect x="680" y="145" width="398" height="240" rx="18" fill="#e8f7f1" stroke="#19986e" stroke-width="2"/><text x="704" y="194" font-size="22" font-weight="700" fill="#087557">PostgreSQL · 三类记录</text><text x="704" y="233" font-size="18" fill="#27364d">documents：逻辑文档</text><text x="704" y="272" font-size="18" fill="#27364d">document_versions：哈希 + 存储键</text><text x="704" y="311" font-size="18" fill="#27364d">ingestion_jobs：PENDING / PENDING</text><text x="704" y="350" font-size="16" fill="#53647e">同知识库相同内容复用已有版本</text><rect x="42" y="418" width="1036" height="66" rx="13" fill="#eaf0fa"/><text x="65" y="458" font-size="18" fill="#253d91">关键区别：storage_key 在数据库；它指向的原始 .md/.pdf 文件在磁盘。</text></g></svg>
